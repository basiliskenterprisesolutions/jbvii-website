<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060609" />

    <!-- REMOVE THIS LINE when the site moves to jbvii.uk. It keeps the
         basilisk.software preview out of Google so it can't outrank the
         client's own domain. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>JBVII — DJ, producer and promoter</title>
    <meta
      name="description"
      content="JBVII is Joe Burke: DJ, producer and promoter from Scotland. Mixes, live dates, press kit and bookings."
    />
    <link rel="canonical" href="https://jbvii.uk/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JBVII" />
    <meta property="og:title" content="JBVII — DJ, producer and promoter" />
    <meta
      property="og:description"
      content="House built for the back half of the night. Mixes, dates and bookings."
    />
    <meta property="og:image" content="https://jbvii.uk/media/hero.webp" />
    <meta property="og:url" content="https://jbvii.uk/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />

    <!-- Archivo for headings and JetBrains Mono for every label, button and
         nav item, as on madeacademy.basilisk.software. Reading copy is Ranade
         rather than Switzer: Switzer is a Helvetica clone and reads as a
         default. Ranade has no 600 — use 500 or 700. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=ranade@300,400,500,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://basilisk.software/badge/basilisk-badge.js" async></script>
  </body>
</html>
